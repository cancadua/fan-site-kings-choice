<h1>Events</h1>

<form class="toolbar" (ngSubmit)="add()">
  <label>
    Name
    <input
      type="text"
      name="name"
      maxlength="100"
      required
      [(ngModel)]="newName"
    />
  </label>
  <label>
    Date
    <input type="date" name="date" [(ngModel)]="newDate" />
  </label>
  <label class="grow">
    Description (optional)
    <input type="text" name="description" [(ngModel)]="newDescription" />
  </label>
  <button type="submit" class="primary" [disabled]="!newName().trim()">
    Add event
  </button>
</form>

@if (error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
}

@if (loading() && events().length === 0) {
  <p class="muted">Loading…</p>
} @else if (events().length === 0) {
  <p class="muted">No events yet.</p>
} @else {
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Description</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (e of events(); track e.id) {
          <tr>
            <td>{{ e.date | date: 'mediumDate' }}</td>
            <td>{{ e.name }}</td>
            <td class="wrap">{{ e.description }}</td>
            <td class="actions">
              <button type="button" class="small danger" (click)="remove(e)">
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
