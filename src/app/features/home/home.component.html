<div class="home">
  <div class="hero-section">
    <div class="hero-overlay">
      <h1 class="hero-title">King's Choice</h1>
      <p class="hero-subtitle">
        Master Strategy. Forge Legends. Rule Your Fate
      </p>
      <div class="hero-cta">
        <a [routerLink]="'/events'" class="cta-button primary">Explore Events</a>
        <a [routerLink]="'/guide'" class="cta-button secondary">View Strategy Guide</a>
      </div>
    </div>
  </div>
  
  <div class="events-highlight-section">
    <h2>Featured Event</h2>
    <p class="section-subtitle">Explore Uncharted Waters</p>
    <div class="events-showcase">
      <div class="event-item">
        <span class="event-icon">⚔</span>
        <h4>Uncharted Waters</h4>
        <span class="event-label">Trading Event</span>
      </div>
    </div>
    <div class="highlight-cta">
      <a [routerLink]="'/events'" class="cta-button explore">Explore All Events</a>
    </div>
  </div>

  <div class="cta-section">
    <h2>Ready to Rule?</h2>
    <p>Join experienced Lords making history in King's Choice</p>
    <div class="cta-buttons-footer">
      <a [routerLink]="'/events'" class="cta-button primary">Learn Events</a>
      <a [routerLink]="'/guide'" class="cta-button secondary">Learn Strategy</a>
    </div>
  </div>
</div>
