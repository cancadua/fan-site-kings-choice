<div class="medieval-container">
  <div class="search-header">
    <div class="decorative-line left"></div>
    <div class="search-wrapper">
      <div class="search-input-group">
        <input
          type="text"
          placeholder="⚔ Search the realms..."
          [(ngModel)]="searchQuery"
          (keydown)="onSearchKeyDown($event)"
          (blur)="onSearchBlur()"
          class="search-input"
        />
        <button
          (click)="moveFilteredLastCity()"
          class="confirm-button"
          type="button"
          title="Move"
        >
          →
        </button>
      </div>
    </div>
    <div class="decorative-line right"></div>
  </div>

  <div class="segmented-tabs">
    <button
      type="button"
      class="segment"
      [class.active]="activeColumn() === 'A'"
      (click)="selectColumn('A')"
    >
      👑 Populated <span class="count">{{ nonEmpty().length }}</span>
    </button>
    <button
      type="button"
      class="segment"
      [class.active]="activeColumn() === 'B'"
      (click)="selectColumn('B')"
    >
      💀 Vacant <span class="count">{{ empty().length }}</span>
    </button>
  </div>

  <div class="cities-grid">
    <div
      class="column populated-column"
      [class.active]="activeColumn() === 'A'"
    >
      <div class="column-header">
        <span class="crown">👑</span>
        <h2>Populated Cities</h2>
        <span class="crown">👑</span>
      </div>
      <div
        class="uw-cities-space"
        (dragover)="onDragOver($event)"
        (drop)="onDrop('A', null)"
      >
        <div class="city-list">
          @for (city of filteredNonEmpty(); let i = $index; track $index) {
          <div
            draggable="true"
            (dragstart)="onDragStart(city, 'A', i, $event)"
            (dragover)="onDragOver($event)"
            (drop)="onDrop('A', i)"
            class="city-item"
          >
            <app-city-button
              [city]="city"
              [nonEmpty]="true"
              (move)="moveCity(city, 'A')"
            ></app-city-button>
          </div>
          }
        </div>
      </div>
    </div>

    <div class="column empty-column" [class.active]="activeColumn() === 'B'">
      <div class="column-header">
        <span class="skull">💀</span>
        <h2>Vacant Cities</h2>
        <span class="skull">💀</span>
      </div>
      <div
        class="uw-cities-space"
        (dragover)="onDragOver($event)"
        (drop)="onDrop('B', null)"
      >
        <div class="city-list">
          @for (city of filteredEmpty(); let i = $index; track $index) {
          <div
            draggable="true"
            (dragstart)="onDragStart(city, 'B', i, $event)"
            (dragover)="onDragOver($event)"
            (drop)="onDrop('B', i)"
            class="city-item"
          >
            <app-city-button
              [city]="city"
              (move)="moveCity(city, 'B')"
            ></app-city-button>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
