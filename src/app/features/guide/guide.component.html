<app-tabs
  [tabs]="tabs"
  [tabHref]="tabHref"
  [activeTab]="activeTab()"
  (activeTabChange)="onTabChange($event)"
>
  @if (activeTab().value === 'guide') {
    <app-guide-advanced></app-guide-advanced>
  } @else if (activeTab().value === 'tips') {
    <app-guide-tips></app-guide-tips>
  }
</app-tabs>
