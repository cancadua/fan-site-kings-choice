<div class="tabs-wrapper" #tabsWrapper>
  <div class="tabs" role="tablist" #tabsContainer>
    @for (tab of visibleTabs; track tab.value) {
      <a
        role="tab"
        [id]="tabId(tab)"
        [href]="tabHref()(tab)"
        [class.active]="tab.value === activeTab()?.value"
        [attr.aria-selected]="tab.value === activeTab()?.value"
        [attr.aria-controls]="panelId"
        [tabIndex]="tab.value === activeTab()?.value ? 0 : -1"
        (click)="onTabClick($event, tab)"
        (keydown)="onTabKeydown($event)"
      >
        {{ tab.label }}
      </a>
    }
  </div>
</div>

<div
  class="tab-content"
  #panel
  role="tabpanel"
  [id]="panelId"
  [attr.aria-labelledby]="activeTabId"
>
  <ng-content></ng-content>
</div>

@if (visibleTabs.length > 1) {
  <nav class="tab-pager" aria-label="More sections">
    @if (prevTab; as prev) {
      <a
        class="tab-pager__link tab-pager__link--prev"
        [href]="tabHref()(prev)"
        (click)="onTabClick($event, prev, true)"
      >
        <app-icon name="chevronLeft" />
        <span class="tab-pager__text">
          <span class="tab-pager__hint">Previous</span>
          <span class="tab-pager__label">{{ prev.label }}</span>
        </span>
      </a>
    }
    @if (nextTab; as next) {
      <a
        class="tab-pager__link tab-pager__link--next"
        [href]="tabHref()(next)"
        (click)="onTabClick($event, next, true)"
      >
        <span class="tab-pager__text">
          <span class="tab-pager__hint">Next</span>
          <span class="tab-pager__label">{{ next.label }}</span>
        </span>
        <app-icon name="chevronRight" />
      </a>
    }
  </nav>
}
