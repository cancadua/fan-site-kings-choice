<div class="events-highlight-section">
  <h2>Featured Events</h2>
  <p class="section-subtitle">Explore the latest events</p>
  <div class="events-showcase">
    <a [routerLink]="'/events'" [queryParams]="{ event: 'uncharted-waters' }" class="event-item">
      <h4>Uncharted Waters</h4>
      <span class="event-label">Trade & Plunder Event</span>
    </a>
    <a [routerLink]="'/events'" [queryParams]="{ event: 'reap-what-you-sow' }" class="event-item">
      <h4>Reap What You Sow</h4>
      <span class="event-label">Flora & Fauna Event</span>
    </a>
    <a [routerLink]="'/events'" [queryParams]="{ event: 'struggle-for-supremacy' }" class="event-item">
      <h4>Struggle for Supremacy</h4>
      <span class="event-label">Alliance Season Event</span>
    </a>
  </div>
  <div class="highlight-cta">
    <a [routerLink]="'/events'" class="cta-button explore">Explore All Events</a>
  </div>
</div>
