<div class="events-highlight-section">
  <h2>Featured Events</h2>
  <p class="section-subtitle">Explore the latest events</p>
  <div class="events-showcase">
    @for (event of events; track event.id; let i = $index) {
      <a
        [routerLink]="['/events', event.id]"
        class="event-item"
        [style.--i]="i"
      >
        <span class="event-icon" aria-hidden="true">{{ event.icon }}</span>
        <h4>{{ event.title }}</h4>
        <span class="event-label">{{ event.label }}</span>
      </a>
    }
  </div>
</div>
