<header>
  <div class="navbar">
    <div class="nav-left">
      <a [routerLink]="navLinks[0].route" (click)="closeMenu()">{{ navLinks[0].label }}</a>
    </div>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen()">
      <span class="line line1"></span>
      <span class="line line2"></span>
      <span class="line line3"></span>
    </button>

    <nav class="nav-right" [class.open]="menuOpen()">
      @for (link of navLinks.slice(1); track $index) {
      <a [routerLink]="link.route" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>
  </div>
</header>
