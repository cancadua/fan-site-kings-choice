<header>
  <div class="navbar">
    <div class="nav-left">
      <a [routerLink]="navLinks[0].route" (click)="closeMenu()">{{
        navLinks[0].label
      }}</a>
    </div>

    <button
      class="hamburger"
      (click)="toggleMenu()"
      [class.active]="menuOpen()"
    >
      <span class="line line1"></span>
      <span class="line line2"></span>
      <span class="line line3"></span>
    </button>

    <nav class="nav-right" [class.open]="menuOpen()">
      @for (link of navLinks.slice(1); track $index) {
        <a [routerLink]="link.route" (click)="closeMenu()">{{ link.label }}</a>
      }
      <button
        type="button"
        class="search-trigger"
        aria-keyshortcuts="Control+K Meta+K /"
        (click)="openSearch()"
      >
        <app-icon name="search" />
        <span>Search</span>
        <kbd>{{ search.shortcutLabel() }}</kbd>
      </button>
      <a
        class="kofi-link"
        (click)="onKofiClick()"
        [href]="kofiUrl"
        target="_blank"
        rel="noopener noreferrer"
        >☕ Ko-fi</a
      >
    </nav>
  </div>
</header>

<nav class="bottom-nav">
  @for (link of navLinks; track $index) {
    <a
      [routerLink]="link.route"
      class="bottom-nav-link"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.route === '/' }"
    >
      <span class="icon">{{ getIcon(link.label) }}</span>
      <span class="label">{{ link.label }}</span>
    </a>
  }
  <button type="button" class="bottom-nav-link" (click)="openSearch()">
    <span class="icon">🔍</span>
    <span class="label">Search</span>
  </button>
</nav>

<!-- Site search: its code loads the first time it is opened. -->
@defer (when search.loaded()) {
  <app-command-palette
    [open]="search.isOpen()"
    (openChange)="search.isOpen.set($event)"
  />
}
