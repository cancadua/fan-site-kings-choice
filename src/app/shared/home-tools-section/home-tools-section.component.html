<section class="tools-section">
  <app-section-heading
    eyebrow="Free to use"
    heading="Tools of the Tavern"
    subtitle="Everything a Lord needs, hanging on the tavern wall"
  />
  <div class="tools-grid">
    @for (tool of tools; track tool.title; let i = $index) {
      <a
        class="tool-card"
        [routerLink]="tool.route"
        [queryParams]="tool.queryParams"
        [style.--i]="i"
      >
        <span class="tool-emblem" aria-hidden="true"
          ><app-icon [name]="tool.icon"
        /></span>
        <h3>{{ tool.title }}</h3>
        <p>{{ tool.text }}</p>
        <span class="tool-link">Open <app-icon name="chevronRight" /></span>
      </a>
    }
  </div>
</section>
